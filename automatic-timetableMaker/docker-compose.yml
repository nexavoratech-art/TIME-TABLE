version: '3.8'

services:
  app:
    build: .
    container_name: timetable-app
    ports:
      - "8000:80"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=Muhigi@123
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - timetable-network

  mysql:
    image: mysql:8.0
    container_name: timetable-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Muhigi@123
      MYSQL_DATABASE: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - timetable-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  timetable-network:
    driver: bridge
